<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alex Sample · Bar Mitzvah · August 22, 2026</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: #0E0606;
    }

    #stage {
      position: relative;
      width: 100vw; height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(175deg,
        #0E0606 0%,
        #140707 35%,
        #1B0908 65%,
        #130808 100%);
      overflow: hidden;
    }

    #stars {
      position: absolute;
      inset: 0;
      width: 100%; height: 100%;
      pointer-events: none;
    }

    #stage::after {
      content: '';
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 38%;
      background: linear-gradient(to top,
        rgba(200, 58, 24, 0.07) 0%,
        rgba(217, 104, 24, 0.03) 50%,
        transparent 100%);
      pointer-events: none;
    }

    .logo-wrap {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Inline SVG sized to fit comfortably within the viewport.
       Artwork viewBox is 1792x2380; aspect ratio = 1792/2380 ≈ 0.753 */
    .dj-logo {
      height: 140vh;
      width: calc(140vh * 1792 / 2380);
      overflow: visible;
      filter: drop-shadow(0 0 50px rgba(180, 60, 8, 0.28));
      animation: fadeIn 1.8s ease forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div id="stage">
    <canvas id="stars" aria-hidden="true"></canvas>

    <div class="logo-wrap">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1792 2380"
           class="dj-logo" aria-label="AS monogram — Alex Sample Bar Mitzvah">
  <defs>
    <linearGradient id="dj-grad" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%"   stop-color="#6B0E05"/>
      <stop offset="25%"  stop-color="#9E1F10"/>
      <stop offset="50%"  stop-color="#C83A18"/>
      <stop offset="75%"  stop-color="#D96818"/>
      <stop offset="100%" stop-color="#EAAC2C"/>
    </linearGradient>
  </defs>
  <text x="896" y="1450" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="1100" fill="url(#dj-grad)">AS</text>
</svg>
    </div>
  </div>

  <script>
    /* ── Galactic starfield + shooting stars ─────────────────────────────────── */
    (function () {
      'use strict';

      const canvas = document.getElementById('stars');
      const ctx    = canvas.getContext('2d');
      const TAU    = Math.PI * 2;
      let stars    = [];
      let shooters = [];
      let nextShoot = Date.now() + 10000 + Math.random() * 10000;

      function resize() {
        canvas.width  = window.innerWidth;
        canvas.height = window.innerHeight;
      }

      function hexRgba(hex, a) {
        const r = parseInt(hex.slice(1, 3), 16);
        const g = parseInt(hex.slice(3, 5), 16);
        const b = parseInt(hex.slice(5, 7), 16);
        return `rgba(${r},${g},${b},${a.toFixed(3)})`;
      }

      /* 500 stars: 38% in a tilted Milky Way band, 62% uniform.
         Power-law size distribution: many tiny, few bright focal points. */
      function makeStars() {
        stars = [];
        const W = canvas.width, H = canvas.height;
        const mwAngle   = 0.12;
        const mwCenterY = H * 0.47;
        const mwHalfW   = H * 0.15;   /* tighter band = higher visual density */
        const TOTAL = 1400;

        for (let i = 0; i < TOTAL; i++) {
          let x, y;
          const inBand = i < TOTAL * 0.50;  /* 50 % of stars go in the MW band */
          if (inBand) {
            x = Math.random() * W;
            const bcy = mwCenterY + (x - W / 2) * Math.tan(mwAngle);
            const t = Math.random() * 2 - 1;
            y = bcy + Math.sign(t) * Math.pow(Math.abs(t), 0.55) * mwHalfW;
            y = Math.max(0, Math.min(H, y));
          } else {
            x = Math.random() * W;
            y = Math.random() * H;
          }

          const u = Math.random();
          let r;
          if      (u < 0.52) r = 0.20 + (u / 0.52) * 0.38;
          else if (u < 0.80) r = 0.58 + ((u - 0.52) / 0.28) * 0.72;
          else if (u < 0.94) r = 1.30 + ((u - 0.80) / 0.14) * 0.90;
          else                r = 2.20 + ((u - 0.94) / 0.06) * 2.80;

          const cr = Math.random();
          let color;
          if      (cr < 0.36) color = '#FFFFFF';
          else if (cr < 0.52) color = '#D8EEFF';
          else if (cr < 0.65) color = '#A0C8F0';
          else if (cr < 0.72) color = '#78AAEE';
          else if (cr < 0.80) color = '#FFF8F0';
          else if (cr < 0.87) color = '#EAAC2C';
          else if (cr < 0.93) color = '#D96818';
          else                color = '#C0B0FF';

          const baseAlpha = r < 0.58
            ? 0.12 + Math.random() * 0.28
            : r < 1.30
            ? 0.30 + Math.random() * 0.45
            : 0.55 + Math.random() * 0.40;

          /* Stars in the Milky Way band glow a little brighter */
          const finalAlpha = Math.min(1, baseAlpha + (inBand ? 0.12 : 0));
          const twinkle = Math.random() < 0.50;

          stars.push({
            x, y, r, color,
            alpha:    finalAlpha,
            minAlpha: twinkle ? Math.max(0.08, finalAlpha * 0.18) : finalAlpha,
            speed:    twinkle
              ? (Math.random() * 0.030 + 0.012) * (Math.random() > 0.5 ? 1 : -1)
              : 0,
          });
        }
      }

      function drawSpike(x, y, outer, inner) {
        ctx.beginPath();
        for (let i = 0; i < 8; i++) {
          const angle = (i * Math.PI) / 4 - Math.PI / 2;
          const rr = i % 2 === 0 ? outer : inner;
          const px = x + Math.cos(angle) * rr;
          const py = y + Math.sin(angle) * rr;
          i === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
        }
        ctx.closePath();
        ctx.fill();
      }

      function drawStarShape(s) {
        const { x, y, r, color, alpha } = s;
        ctx.save();
        if (r < 0.75) {
          ctx.globalAlpha = Math.max(0, Math.min(1, alpha)) * 0.85;
          ctx.fillStyle   = color;
          ctx.beginPath();
          ctx.arc(x, y, Math.max(0.25, r), 0, TAU);
          ctx.fill();
        } else if (r < 1.8) {
          ctx.globalAlpha = Math.max(0, Math.min(1, alpha)) * 0.88;
          ctx.fillStyle   = color;
          drawSpike(x, y, r * 1.9, r * 0.30);
        } else {
          const grd = ctx.createRadialGradient(x, y, 0, x, y, r * 5.5);
          grd.addColorStop(0,    hexRgba(color, 0.22));
          grd.addColorStop(0.5,  hexRgba(color, 0.08));
          grd.addColorStop(1,    hexRgba(color, 0));
          ctx.globalAlpha = Math.max(0, Math.min(1, alpha));
          ctx.fillStyle   = grd;
          ctx.beginPath();
          ctx.arc(x, y, r * 5.5, 0, TAU);
          ctx.fill();
          ctx.fillStyle = color;
          drawSpike(x, y, r * 2.1, r * 0.28);
        }
        ctx.restore();
      }

      function drawMilkyWayGlow() {
        const W = canvas.width, H = canvas.height;
        ctx.save();
        ctx.translate(W * 0.50, H * 0.47);
        ctx.scale(1, 0.36);
        const grd = ctx.createRadialGradient(0, 0, 0, 0, 0, W * 0.55);
        grd.addColorStop(0,    'rgba(140, 175, 240, 0.065)');
        grd.addColorStop(0.45, 'rgba(110, 150, 220, 0.028)');
        grd.addColorStop(1,    'rgba(90,  130, 210, 0)');
        ctx.fillStyle = grd;
        ctx.beginPath();
        ctx.arc(0, 0, W * 0.55, 0, TAU);
        ctx.fill();
        ctx.restore();
      }

      function spawnShooter() {
        /* Shallow angle (18–35°) so streak runs mostly horizontal */
        const angle = (Math.PI / 10) + Math.random() * (Math.PI / 9);
        const speed = 21 + Math.random() * 15;
        /* Start from off-screen left or top-left quadrant so the full
           traversal sweeps across visible canvas */
        shooters.push({
          x:     -60 + Math.random() * canvas.width  * 0.55,
          y:     Math.random() * canvas.height * 0.45,
          dx:    Math.cos(angle) * speed,
          dy:    Math.sin(angle) * speed,
          life:  1,
          decay: 0.008 + Math.random() * 0.007,  /* slow fade → long lifespan */
          tail:  790 + Math.random() * 610,        /* 790–1400 px visual trail */
        });
      }

      function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        drawMilkyWayGlow();

        for (const s of stars) {
          if (s.speed !== 0) {
            s.alpha += s.speed;
            if (s.alpha <= s.minAlpha || s.alpha >= 1) s.speed *= -1;
            s.alpha = Math.max(s.minAlpha, Math.min(1, s.alpha));
          }
          drawStarShape(s);
        }

        const now = Date.now();
        if (now >= nextShoot) {
          spawnShooter();
          nextShoot = now + 10000 + Math.random() * 10000;
        }
        for (let i = shooters.length - 1; i >= 0; i--) {
          const s = shooters[i];
          s.x    += s.dx;
          s.y    += s.dy;
          s.life -= s.decay;
          if (s.life <= 0) { shooters.splice(i, 1); continue; }
          const hyp   = Math.hypot(s.dx, s.dy);
          const tailX = s.x - s.dx * (s.tail / hyp);
          const tailY = s.y - s.dy * (s.tail / hyp);
          const grad  = ctx.createLinearGradient(tailX, tailY, s.x, s.y);
          grad.addColorStop(0,   'rgba(255,255,255,0)');
          grad.addColorStop(0.7, `rgba(255,240,220,${(s.life * 0.5).toFixed(3)})`);
          grad.addColorStop(1,   `rgba(255,255,255,${s.life.toFixed(3)})`);
          ctx.save();
          ctx.strokeStyle = grad;
          ctx.lineWidth   = 2.5;
          ctx.lineCap     = 'round';
          ctx.beginPath();
          ctx.moveTo(tailX, tailY);
          ctx.lineTo(s.x,   s.y);
          ctx.stroke();
          ctx.globalAlpha = s.life * 0.9;
          ctx.fillStyle   = '#fff';
          drawSpike(s.x, s.y, 5.0, 1.2);
          ctx.restore();
        }

        requestAnimationFrame(draw);
      }

      resize();
      makeStars();
      draw();

      let resizeTimer;
      window.addEventListener('resize', () => {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(() => { resize(); makeStars(); }, 200);
      });
    })();
  </script>

</body>
</html>
